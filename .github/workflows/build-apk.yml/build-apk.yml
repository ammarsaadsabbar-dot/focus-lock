
name: Build Focus Lock APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip FocusLock-fixed.zip -d project
          find project -name settings.gradle.kts -o -name settings.gradle

      - name: Build APK
        run: |
          PROJECT_DIR="$(dirname "$(find project -name settings.gradle.kts -o -name settings.gradle | head -n 1)")"
          test -n "$PROJECT_DIR"
          gradle -p "$PROJECT_DIR" :app:assembleDebug --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          
